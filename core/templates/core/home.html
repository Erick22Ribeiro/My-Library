    <hr>

    {% for livro in livros %}
    <div style="margin-bottom: 20px;">
        <h3>{{ livro.titulo }}</h3>
        <p>{{ livro.autor }} - {{ livro.ano }}</p>

        {% if livro.capa %}
        <img src="{{ livro.capa }}">
        {% endif %}
    </div>
    {% empty %}
    <p>Nenhum resultado</p>
    {% endfor %}
